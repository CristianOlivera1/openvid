services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - pnpm-store:/pnpm/store
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]

volumes:
  pnpm-store: